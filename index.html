<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Familiada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* Old-school Familiada: yellow dot-matrix on black. Doto is the LED font; offline it falls back to bold monospace. */
  :root { --y: #ffcf1f; --dim: #6b5500; --glow: rgba(255, 207, 31, .55); --red: #ff4a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #000; color: var(--y);
         font: bold 16px "Courier New", Courier, monospace; }
  .led, h1, h2, .score, #board { font-family: "Doto", "Courier New", monospace; font-weight: 900; text-shadow: 0 0 .12em var(--glow); }
  button { font: inherit; cursor: pointer; border: 2px solid var(--y); border-radius: 0; background: #000; color: var(--y);
           padding: .5em 1em; text-transform: uppercase; }
  button:hover:not(:disabled) { background: #2a2100; }
  button:disabled { opacity: .35; cursor: default; }
  button.on { background: var(--y); color: #000; }
  input, select, textarea { font: inherit; padding: .4em; border-radius: 0; border: 1px solid var(--dim); background: #000; color: var(--y); }
  [hidden] { display: none !important; }

  /* Setup + Host */
  #setup, #host { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  h1, h2 { margin: .3em 0; text-transform: uppercase; }
  .panel { border: 1px dashed var(--dim); padding: 12px; margin-bottom: 12px; }
  #host .ans { display: grid; grid-template-columns: 2em 1fr 3em 9em; gap: 8px; align-items: center; padding: 6px 0;
               border-bottom: 1px dotted var(--dim); font-size: 1.2rem; text-transform: uppercase; }
  #host .ans.done { opacity: .4; }
  #host .ok { background: var(--y); color: #000; }
  #host .wrong { border-color: var(--red); color: var(--red); font-size: 1.5rem; padding: .5em 1.5em; }
  #host .wrong:hover:not(:disabled) { background: #300; }
  #host .strikes { font-size: 2rem; color: var(--red); letter-spacing: .2em; min-width: 4em; }
  .score { font-size: 2rem; }
  #setup textarea { width: 100%; height: 55vh; }
  #setup .start { background: var(--y); color: #000; font-size: 1.2rem; }
  .lamp i { display: inline-block; width: .7em; height: .7em; margin-right: .6em; border-radius: 50%;
            border: 1px solid var(--dim); background: #221b00; vertical-align: -.05em; }
  .lamp[aria-pressed="true"] i { background: var(--y); border-color: var(--y); box-shadow: 0 0 .5em var(--y); }
  .i18n { display: inline-grid; }
  .i18n > * { grid-area: 1 / 1; }
  .i18n > .off { visibility: hidden; }
  .langs { margin-left: auto; display: flex; gap: 4px; }
  .langs button { padding: .3em .6em; }
  .hint { opacity: .6; font-size: .9rem; }

  /* Board */
  #board { --u: min(1vh, .5625vw); height: 100vh; overflow: hidden; display: grid; place-items: center; padding: calc(3 * var(--u)) 2vw; }
  #board .screen { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2vw; }
  #board .side { text-align: center; }
  #board .name { font-size: calc(4 * var(--u)); text-transform: uppercase; margin-bottom: calc(1.5 * var(--u)); }
  #board .box { display: inline-block; min-width: 3.4ch; padding: 0 .3ch; text-align: right; font-size: calc(10 * var(--u)); line-height: 1.2;
                border: calc(.3 * var(--u)) solid #2b2b2b; background: #0a0a0a; }
  #board .center { display: flex; flex-direction: column; align-items: center; gap: calc(2 * var(--u)); }
  #board .question { font-size: calc(3.6 * var(--u)); max-width: 55vw; text-align: center; text-transform: uppercase;
                    height: 2.4em; line-height: 1.2; overflow: hidden; display: flex; align-items: center; } /* fixed 2-line slot */
  /* Fixed size with room for 8 answers + SUMA, so nothing moves when a question has fewer answers */
  #board .rows { display: grid; grid-template-columns: auto 16ch 3ch; grid-auto-rows: 1.2em; align-content: start; column-gap: 1ch;
                 font-size: calc(6 * var(--u)); height: calc(9 * 1.2em + .3em); text-transform: uppercase; }
  #board .t { white-space: nowrap; overflow: hidden; }
  #board .blank { transform: translateY(-.35em); } /* lift baseline dots to mid-height so rows look evenly spaced */
  #board .p { text-align: right; }
  #board .suma { text-align: right; margin-top: .3em; }
  #board .new { animation: blink .6s steps(2, jump-none) 2; }
  @keyframes blink { 50% { opacity: 0; } }
  #board .play { display: flex; align-items: center; gap: 2vw; }
  #board .strikes, #board .play::after { content: ''; width: calc(10 * var(--u)); }
  #board .strikes { display: flex; flex-direction: column; align-items: center; font-size: calc(16 * var(--u)); line-height: 1; }
  #waiting { font-size: calc(4 * var(--u)); opacity: .7; text-transform: uppercase; }
</style>
</head>
<body>

<main id="setup" hidden>
  <div class="bar"><h1 data-tt="setupTitle"></h1><span class="langs"></span></div>
  <div class="bar">
    <label><span data-tt="team1"></span> <input class="teamName" maxlength="20" data-tp="teamA"></label>
    <label><span data-tt="team2"></span> <input class="teamName" maxlength="20" data-tp="teamB"></label>
  </div>
  <p class="hint" data-t="setupHint"></p>
  <textarea id="qText" spellcheck="false"></textarea>
  <div class="bar">
    <button class="start" id="startGame" data-tt="start"></button>
    <button id="importQ" data-tt="import"></button>
    <button id="exportQ" data-tt="export"></button>
    <button id="resetQ" data-tt="reset"></button>
    <input type="file" id="qFile" accept=".json,application/json" hidden>
  </div>
</main>

<main id="host" hidden>
  <div id="hostUi"></div>
  <p class="hint" data-th="shortcuts"></p>
</main>

<main id="board" hidden>
  <div id="waiting" data-t="waiting"></div>
  <div class="screen" hidden>
    <div class="side"><div class="name"></div><div class="pts box"></div></div>
    <div class="center">
      <div class="bank box"></div>
      <div class="question"></div>
      <div class="play"><div class="strikes"></div><div class="rows"></div></div>
    </div>
    <div class="side"><div class="name"></div><div class="pts box"></div></div>
  </div>
</main>

<script>
const KEY = 'familiada-state';
const SAMPLE = `Name something people bring to a party
Drinks 30
Snacks 24
Gift 15
Friend 11
Dessert 8
Music 5
Games 4

Name a reason you might be late to work
Traffic 38
Overslept 27
Kids 12
Car trouble 10
Weather 6
Public transport 4

Name something you do right after waking up x2
Check phone 34
Bathroom 25
Brush teeth 14
Coffee 12
Shower 8
Stretch 4

Name a popular pizza topping x2
Pepperoni 36
Mushrooms 18
Cheese 14
Sausage 11
Ham 8
Pineapple 7
Olives 4

Name something people are afraid of x3
Spiders 31
Heights 22
Snakes 17
Death 10
Clowns 9
Public speaking 7

Name a place where you have to be quiet x3
Library 45
Church 20
Hospital 12
Cinema 10
Exam room 7
Funeral 4`;

/* ---------------- Language (UI only, questions stay as typed) ---------------- */
const LANG_KEY = 'familiada-lang';
const T = {
  en: {
    setupTitle: 'FAMILIADA — setup', team1: 'Team 1', team2: 'Team 2', teamA: 'Team A', teamB: 'Team B',
    setupHint: 'One question per block, blank line between questions. First line = question, then one answer per line ending with its points (max 8 answers). End the question line with x2 or x3 for double/triple points. You can also paste JSON (same format as questions.json) or use Import JSON….',
    start: 'Start game ▶', import: 'Import JSON…', export: 'Export JSON', reset: 'Restore sample questions',
    shortcuts: 'Shortcuts: <b>1–8</b> reveal answer · <b>X</b> wrong answer.',
    waiting: 'Open the host view to start…',
    openBoard: '📺 Open board', question: (n, m) => `Question ${n} / ${m}`, prev: '◀ Prev', next: 'Next ▶', points: 'Points ×',
    qOnBoard: 'Question on board', revealed: 'Revealed', correct: '✓ Correct', wrong: '✗ WRONG', clearStrikes: 'Clear strikes',
    bank: 'Bank', awardTo: name => `Award to ${name}`, revealAll: 'Reveal remaining (no points)',
    awardedHint: 'Round awarded — further reveals add no points.', newGame: 'New game…',
    confirmNew: 'End this game and choose questions for a new one?', suma: 'TOTAL',
    noQuestions: 'No questions found.', needText: 'Every question needs text.',
    badMult: q => `"${q}": multiplier must be 1, 2 or 3.`, badCount: q => `"${q}" needs 1 to 8 answers.`,
    badAnswer: q => `"${q}": every answer needs "text" and non-negative "points".`,
    badLine: line => `"${line}" should look like: answer text 25`,
  },
  pl: {
    setupTitle: 'FAMILIADA — ustawienia', team1: 'Drużyna 1', team2: 'Drużyna 2', teamA: 'Drużyna A', teamB: 'Drużyna B',
    setupHint: 'Jedno pytanie na blok, pusta linia między pytaniami. Pierwsza linia = pytanie, potem po jednej odpowiedzi w linii, zakończonej punktami (maks. 8 odpowiedzi). Dopisz x2 lub x3 na końcu linii pytania, aby podwoić/potroić punkty. Możesz też wkleić JSON (format jak w questions.json) albo użyć „Importuj JSON…”.',
    start: 'Start gry ▶', import: 'Importuj JSON…', export: 'Eksportuj JSON', reset: 'Przywróć przykładowe pytania',
    shortcuts: 'Skróty: <b>1–8</b> odkryj odpowiedź · <b>X</b> zła odpowiedź.',
    waiting: 'Otwórz widok prowadzącego, aby zacząć…',
    openBoard: '📺 Otwórz tablicę', question: (n, m) => `Pytanie ${n} / ${m}`, prev: '◀ Wstecz', next: 'Dalej ▶', points: 'Punkty ×',
    qOnBoard: 'Pytanie na tablicy', revealed: 'Odkryta', correct: '✓ Dobrze', wrong: '✗ ŹLE', clearStrikes: 'Wyczyść błędy',
    bank: 'Pula', awardTo: name => `Punkty dla: ${name}`, revealAll: 'Odkryj resztę (bez punktów)',
    awardedHint: 'Runda rozliczona — kolejne odpowiedzi nie dają punktów.', newGame: 'Nowa gra…',
    confirmNew: 'Zakończyć tę grę i wybrać pytania do nowej?', suma: 'SUMA',
    noQuestions: 'Nie znaleziono pytań.', needText: 'Każde pytanie musi mieć treść.',
    badMult: q => `„${q}”: mnożnik musi wynosić 1, 2 lub 3.`, badCount: q => `„${q}” musi mieć od 1 do 8 odpowiedzi.`,
    badAnswer: q => `„${q}”: każda odpowiedź musi mieć "text" i nieujemne "points".`,
    badLine: line => `„${line}” powinno wyglądać tak: odpowiedź 25`,
  },
};
let lang = 'en';
try { lang = localStorage.getItem(LANG_KEY) || (navigator.language.startsWith('pl') ? 'pl' : 'en'); } catch {}
if (!T[lang]) lang = 'en';
const tIn = (l, key, ...args) => { const v = T[l][key]; return typeof v === 'function' ? v(...args) : v; };
const t = (key, ...args) => tIn(lang, key, ...args);
// Stable-width label: every language stacked in one grid cell, only the current one visible,
// so buttons are as wide as their longest translation and don't shift when switching language.
const tt = (key, ...args) => `<span class="i18n">${Object.keys(T).map(l =>
  `<span${l === lang ? '' : ' class="off" aria-hidden="true"'}>${tIn(l, key, ...args)}</span>`).join('')}</span>`;

function applyLanguage() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll('[data-tt]').forEach(el => el.innerHTML = tt(el.dataset.tt));
  document.querySelectorAll('[data-th]').forEach(el => el.innerHTML = t(el.dataset.th));
  document.querySelectorAll('[data-tp]').forEach(el => el.placeholder = t(el.dataset.tp));
  document.querySelectorAll('.langs').forEach(el => el.innerHTML = langSwitch());
}
const langSwitch = () => Object.keys(T).map(l =>
  `<button data-lang="${l}" class="${l === lang ? 'on' : ''}">${l.toUpperCase()}</button>`).join('');
document.addEventListener('click', e => {
  const b = e.target.closest('[data-lang]');
  if (!b || b.dataset.lang === lang) return;
  localStorage.setItem(LANG_KEY, b.dataset.lang); // the board window picks this up via the storage event
  location.reload();
});

function checkQuestions(qs) {
  if (!Array.isArray(qs) || !qs.length) throw new Error(t('noQuestions'));
  return qs.map(({ q, answers, multiplier = 1 }) => {
    if (typeof q !== 'string' || !q.trim()) throw new Error(t('needText'));
    if (![1, 2, 3].includes(multiplier)) throw new Error(t('badMult', q));
    if (!Array.isArray(answers) || !answers.length || answers.length > 8) throw new Error(t('badCount', q));
    answers = answers.map(a => {
      if (typeof a?.text !== 'string' || !a.text.trim() || !Number.isFinite(a.points) || a.points < 0)
        throw new Error(t('badAnswer', q));
      return { text: a.text.trim(), points: a.points };
    });
    return { q: q.trim(), multiplier, answers: answers.sort((a, b) => b.points - a.points) };
  });
}

function parseQuestions(text) {
  if (!text.trim()) throw new Error(t('noQuestions'));
  return checkQuestions(text.trim().split(/\n\s*\n/).map(block => {
    const [first, ...lines] = block.split('\n').map(l => l.trim()).filter(Boolean);
    const [, q, m] = first.match(/^(.*?)(?:\s+[x×]([123]))?$/i); // "Question x2" = double points
    const answers = lines.map(line => {
      const m = line.match(/^(.+?)\s+(\d+)$/);
      if (!m) throw new Error(t('badLine', line));
      return { text: m[1], points: +m[2] };
    });
    return { q, answers, multiplier: m ? +m : 1 };
  }));
}

// questions.json format: [{ "question": "...", "multiplier": 2, "answers": [{ "text": "...", "points": 30 }] }] (multiplier optional, default 1)
const fromJson = data => checkQuestions(Array.isArray(data)
  ? data.map(x => ({ q: x?.question, answers: x?.answers, multiplier: x?.multiplier ?? 1 })) : null);
const toJson = qs => JSON.stringify(qs.map(q => ({ question: q.q, ...(q.multiplier > 1 && { multiplier: q.multiplier }), answers: q.answers })), null, 2);

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.questions ? s : null; } catch { return null; }
}

const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

/* ---------------- Host ---------------- */
let state;
const cur = () => state.questions[state.round];

function newGame(questions, names = ['Team A', 'Team B']) {
  state = { teams: names.map(name => ({ name, score: 0 })), questions, event: { type: null, n: 0 } };
  startRound(0);
}
function startRound(round) {
  Object.assign(state, { round, revealed: state.questions[round].answers.map(() => false),
                         strikes: 0, bank: 0, multiplier: state.questions[round].multiplier || 1, awarded: false, showQuestion: false });
}
function save(eventType) {
  if (eventType) state.event = { type: eventType, n: state.event.n + 1 };
  localStorage.setItem(KEY, JSON.stringify(state));
  if (view === 'host') { renderHost(); if (eventType) playSound(eventType); }
}

const act = {
  reveal(i) {
    if (i >= state.revealed.length || state.revealed[i]) return;
    state.revealed[i] = true;
    if (!state.awarded) state.bank += cur().answers[i].points;
    save('reveal');
  },
  wrong() { state.strikes = Math.min(3, state.strikes + 1); save('strike'); },
  clearStrikes() { state.strikes = 0; save(); },
  award(t) {
    if (state.awarded) return;
    state.teams[t].score += state.bank * state.multiplier;
    state.bank = 0; state.awarded = true;
    save('award');
  },
  revealAll() { state.revealed.fill(true); save(); },
  mult(m) { state.multiplier = m; save(); },
  round(r) { if (r >= 0 && r < state.questions.length) { startRound(r); save(); } },
  toggleQ() { state.showQuestion = !state.showQuestion; save(); },
  openBoard() { window.open(location.href.split('#')[0] + '#board', 'familiada-board', 'popup,width=1280,height=720'); },
  newGame() {
    if (confirm(t('confirmNew'))) location.hash = 'setup';
  },
};

function renderHost() {
  const q = cur(), s = state;
  document.getElementById('hostUi').innerHTML = `
    <div class="bar">
      <button data-a="openBoard">${tt('openBoard')}</button>
      <span>${tt('question', s.round + 1, s.questions.length)}</span>
      <button data-a="round" data-i="${s.round - 1}" ${s.round === 0 ? 'disabled' : ''}>${tt('prev')}</button>
      <button data-a="round" data-i="${s.round + 1}" ${s.round === s.questions.length - 1 ? 'disabled' : ''}>${tt('next')}</button>
      <span>${tt('points')}</span>${[1, 2, 3].map(m =>
        `<button data-a="mult" data-i="${m}" class="${s.multiplier === m ? 'on' : ''}">${m}</button>`).join('')}
      <button data-a="toggleQ" class="lamp" aria-pressed="${s.showQuestion}"><i></i>${tt('qOnBoard')}</button>
    </div>
    <div class="panel">
      <h2>${esc(q.q)}</h2>
      ${q.answers.map((a, i) => `
        <div class="ans ${s.revealed[i] ? 'done' : ''}">
          <b>${i + 1}</b><span>${esc(a.text)}</span><b>${a.points}</b>
          <button class="ok" data-a="reveal" data-i="${i}" ${s.revealed[i] ? 'disabled' : ''}>${s.revealed[i] ? t('revealed') : t('correct')}</button>
        </div>`).join('')}
    </div>
    <div class="panel bar">
      <button class="wrong" data-a="wrong" ${s.strikes >= 3 ? 'disabled' : ''}>${tt('wrong')}</button>
      <span class="strikes">${'✗'.repeat(s.strikes)}${'·'.repeat(3 - s.strikes)}</span>
      <button data-a="clearStrikes">${tt('clearStrikes')}</button>
    </div>
    <div class="panel bar">
      <span class="score">${tt('bank')}: ${s.bank * s.multiplier}</span>
      ${s.teams.map((team, i) => `<button data-a="award" data-i="${i}" ${s.awarded ? 'disabled' : ''}>${tt('awardTo', esc(team.name))}</button>`).join('')}
      <button data-a="revealAll">${tt('revealAll')}</button>
      ${s.awarded ? `<span class="hint">${t('awardedHint')}</span>` : ''}
    </div>
    <div class="bar"><button data-a="newGame">${tt('newGame')}</button><span class="langs">${langSwitch()}</span></div>`;
}

const serialize = qs => qs.map(q => [q.q + (q.multiplier > 1 ? ` x${q.multiplier}` : ''), ...q.answers.map(a => `${a.text} ${a.points}`)].join('\n')).join('\n\n');

function initHost() {
  state = load();
  if (!state) { location.hash = 'setup'; return; }
  renderHost();
  const ui = document.getElementById('hostUi');
  ui.addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if (!b) return;
    act[b.dataset.a](+b.dataset.i);
  });
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key >= '1' && e.key <= '8') act.reveal(+e.key - 1);
    if (e.key.toLowerCase() === 'x' && state.strikes < 3) act.wrong();
  });
}

/* ---------------- Setup (question selection) ---------------- */
function readQuestions(text) {
  text = text.trim();
  if (!text.startsWith('[')) return parseQuestions(text);
  try { return fromJson(JSON.parse(text)); }
  catch (err) { throw new Error(`JSON: ${err.message}`); }
}

function initSetup() {
  const saved = load(), qText = document.getElementById('qText'), qFile = document.getElementById('qFile');
  qText.value = saved ? serialize(saved.questions) : SAMPLE;
  const nameInputs = [...document.querySelectorAll('#setup .teamName')];
  nameInputs.forEach((el, i) => el.value = saved?.teams[i].name ?? el.placeholder);
  document.getElementById('startGame').onclick = () => {
    try { newGame(readQuestions(qText.value), nameInputs.map(el => el.value.trim() || el.placeholder)); }
    catch (err) { return alert(err.message); }
    save();
    act.openBoard(); // inside the click handler, so the popup is not blocked
    location.hash = 'host';
  };
  document.getElementById('importQ').onclick = () => qFile.click();
  qFile.onchange = async () => {
    const file = qFile.files[0];
    qFile.value = '';
    if (!file) return;
    try { qText.value = serialize(fromJson(JSON.parse(await file.text()))); }
    catch (err) { alert(`${file.name}: ${err.message}`); }
  };
  document.getElementById('exportQ').onclick = () => {
    let qs;
    try { qs = readQuestions(qText.value); } catch (err) { return alert(err.message); }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([toJson(qs)], { type: 'application/json' }));
    a.download = 'questions.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  document.getElementById('resetQ').onclick = () => { qText.value = SAMPLE; };
}

/* ---------------- Sounds ---------------- */
// Played by the host window: browsers only allow sound in a page the user has clicked, and the host is where
// the clicks happen. Both windows run on the same computer, so the sound goes to the same speakers/TV.
let audio;

function tone(freq, at, dur, type = 'sine', vol = 0.2) {
  audio ??= new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + at;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
}
const sounds = {
  reveal: () => { tone(880, 0, .3); tone(1320, .12, .6); },
  strike: () => { tone(140, 0, .8, 'square', .15); tone(147, 0, .8, 'sawtooth', .12); },
  award: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .35, 'triangle')),
};

// Your own recordings in sounds/<type>.mp3 (reveal, strike, award) win; missing files fall back to the synth above.
const soundFiles = {};
function playSound(type) {
  const a = soundFiles[type] ??= new Audio(`sounds/${type}.mp3`);
  if (a.error) return sounds[type]?.();
  a.currentTime = 0;
  a.play().catch(() => sounds[type]?.());
}

/* ---------------- Board ---------------- */
let prev = null;

function renderBoard() {
  const s = load(), $ = sel => document.querySelector('#board ' + sel);
  $('#waiting').hidden = !!s;
  $('.screen').hidden = !s;
  if (!s) return;
  const q = s.questions[s.round];
  document.querySelectorAll('#board .side').forEach((el, i) => {
    el.querySelector('.name').textContent = s.teams[i].name;
    el.querySelector('.pts').textContent = s.teams[i].score;
  });
  $('.bank').textContent = s.bank * s.multiplier;
  $('.question').style.visibility = s.showQuestion ? 'visible' : 'hidden'; // keep its space so nothing shifts
  $('.question').textContent = q.q;

  const sameRound = prev && prev.round === s.round && prev.q === q.q;
  const rows = $('.rows');
  rows.innerHTML = q.answers.map((a, i) => {
    if (!s.revealed[i]) return `<span>${i + 1}</span><span class="t blank">${'.'.repeat(16)}</span><span class="p">--</span>`;
    const cls = sameRound && !prev.revealed[i] ? ' new' : '';
    return `<span>${i + 1}</span><span class="t${cls}">${esc(a.text)}</span><span class="p${cls}">${a.points * s.multiplier}</span>`;
  }).join('') + `<span></span><span class="suma">${t('suma')}</span><span class="p suma">${
    q.answers.reduce((sum, a, i) => sum + (s.revealed[i] ? a.points * s.multiplier : 0), 0)}</span>`;
  const newStrike = sameRound && s.strikes > prev.strikes;
  $('.strikes').innerHTML = Array.from({ length: s.strikes }, (_, i) =>
    `<span${newStrike && i === s.strikes - 1 ? ' class="new"' : ''}>X</span>`).join('');
  prev = { round: s.round, q: q.q, revealed: s.revealed, strikes: s.strikes };
}

function toggleFullscreen() {
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {});
}

function initBoard() {
  renderBoard();
  window.addEventListener('storage', e => { if (e.key === KEY) renderBoard(); if (e.key === LANG_KEY) location.reload(); });
  document.addEventListener('dblclick', toggleFullscreen);
  document.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'f') toggleFullscreen(); });
}

/* ---------------- Routing ---------------- */
const view = { host: 'host', board: 'board' }[location.hash.slice(1)] || 'setup';
applyLanguage();
document.getElementById(view).hidden = false;
({ setup: initSetup, host: initHost, board: initBoard })[view]?.();
window.addEventListener('hashchange', () => location.reload());
</script>
</body>
</html>
